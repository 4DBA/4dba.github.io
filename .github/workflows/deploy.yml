name: Deploy Hexo Blog

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '_config.yml'
      - '_config.next.yml'
      - 'package.json'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx hexo clean && npx hexo generate
      - name: Deploy to GitHub Pages
        run: |
          git config --global user.name "4DBA"
          git config --global user.email "realk@foxmail.com"
          npx hexo deploy
