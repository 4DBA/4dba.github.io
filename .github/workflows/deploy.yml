name: Deploy Hexo Blog

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '_config.yml'
      - '_config.next.yml'
      - 'package.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx hexo clean && npx hexo generate
      - name: Deploy to GitHub Pages
        run: |
          cd public
          git init
          git checkout -b gh-pages
          git add -A
          git config user.name "4DBA"
          git config user.email "realk@foxmail.com"
          git commit -m "Deploy"
          git push -f https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/4DBA/4dba.github.io.git gh-pages
